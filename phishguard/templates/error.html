{% extends "base.html" %}
{% block title %}Error {{ code }} — PhishGuard{% endblock %}
{% block content %}
  <div class="card" style="max-width:520px;margin:10vh auto;text-align:center;">
    <h1 style="font-size:2.2rem;margin:.2em 0;">{{ code }}</h1>
    <p>{{ message }}</p>
    <p><a href="{{ url_for('admin.dashboard') }}">Back to the dashboard</a></p>
  </div>
{% endblock %}
